services:
  mysql:
    image: mysql:8.4
    container_name: passwort_manager-db
    restart: unless-stopped
    env_file: .env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/${GITHUB_USER}/password-manager-backend:${APP_TAG:-latest}
    container_name: passwort_manager-app
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_SERVER: mysql
      MYSQL_PORT: "3306"
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy


volumes:
  mysql_data:

